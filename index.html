<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit für die Klassenarbeit – Energie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2A44; --blue:#3B6FB6; --dblue:#1F4E79; --green:#2E9E5B; --heat:#E4572E; --marker:#FFD447;
  --paper:#FFFFFF; --grid:#DCE7F5; --muted:#5C6780; --line:#C9D3E3;
  --ok-bg:#E3F4EA; --bad-bg:#FDE8E2; --merk:#DDE8F5; --hilfe:#FDF6EA; --hilfe-rand:#FBD9A8; --lila:#6D4A9E;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:17px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:"Patrick Hand","Comic Sans MS",cursive;font-weight:400;font-size:2.4rem;line-height:1.1;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:4px 4px 0 var(--ink)}
.card h2{font-family:"Patrick Hand",cursive;font-weight:400;font-size:1.75rem;margin:0 0 8px;line-height:1.15}
sub{font-size:.7em}
.hide{display:none!important}
.note{font-size:.93rem;color:var(--muted)}
.choice{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.big{display:block;text-align:left;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;box-shadow:3px 3px 0 var(--ink);min-height:56px}
.big b{font-size:1.1rem;display:block}
.big small{color:var(--muted);display:block;line-height:1.35;margin-top:2px}
.big:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.stars{color:#B8860B;letter-spacing:1px}
#prog{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 14px;padding:8px 0;border-bottom:2px solid var(--ink);position:sticky;top:0;background:rgba(255,255,255,.95);z-index:5}
#prog button{min-width:34px;height:34px;border-radius:999px;border:2px solid var(--line);background:#fff;font:800 13px "Nunito",sans-serif;color:var(--muted);cursor:pointer;padding:0 8px}
#prog button.cur{border-color:var(--ink);color:#fff;background:var(--ink)}
#prog button.ok{border-color:var(--green);color:var(--green)}
#prog button.teil{border-color:#B8860B;color:#B8860B}
#prog button.nein{border-color:var(--heat);color:var(--heat)}
#prog button.cur.ok,#prog button.cur.teil,#prog button.cur.nein{color:#fff}
#prog .info{margin-left:auto;font-weight:800;font-size:.9rem;color:var(--muted)}
.kopf{font:800 13px "Nunito",sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.chip{font:700 12px "Nunito",sans-serif;border:1.5px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted);white-space:nowrap}
.chip.k{border-color:#9DB9DE;color:var(--dblue)}
.material{border:2px dashed var(--line);border-radius:12px;padding:12px 14px;margin:8px 0 14px;background:#FBFCFE}
.material .ml{font:800 13px "Nunito",sans-serif;color:var(--blue);margin-bottom:4px}
table.t{border-collapse:collapse;width:100%;margin-top:6px;font-size:.97rem}
table.t th{text-align:left;color:var(--dblue);font-weight:800;border-bottom:1.5px solid var(--dblue);padding:4px 8px}
table.t td{border-bottom:1px solid var(--line);padding:5px 8px;vertical-align:top}
table.t td.n{text-align:right;white-space:nowrap;font-weight:700}
.ad{border:3px solid var(--heat);border-radius:12px;padding:12px 14px;text-align:center;background:#FFF5F0;transform:rotate(-1deg);max-width:470px;margin:6px auto}
.ad b{font-size:1.3rem;display:block;color:var(--heat)}
.teil{border-top:2px solid var(--line);padding-top:12px;margin-top:14px}
.teil:first-child{border-top:none;margin-top:0;padding-top:0}
.tl{font-weight:800;color:var(--dblue);font-size:1.05rem}
.q{font-size:1.06rem;font-weight:700;margin:6px 0 10px}
.svgbox{text-align:center;margin:6px 0}
.svgbox svg{width:100%;max-width:440px;height:auto}
.mcl{list-style:none;padding:0;margin:4px 0;display:grid;gap:6px}
.mcl li{border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;display:flex;gap:10px}
.mcl li b.L{color:var(--dblue);min-width:1.4em}
.mcl.diag{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.mcl.diag li{flex-direction:column;align-items:center}
.mcl.diag svg{width:100%;max-width:360px;height:auto}
.auswahl{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.auswahl span{border:1.5px solid #9DB9DE;background:var(--merk);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.95rem}
.zr{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:4px 0}
.zr .nr{font-weight:800;color:var(--dblue)}
.leer{display:inline-block;min-width:90px;border-bottom:2px solid var(--muted);margin:0 6px}
.heft{background:#fff;border:2px dashed var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);font-weight:700;margin-top:6px}
.fuenf{background:var(--hilfe);border:2px solid var(--hilfe-rand);border-radius:12px;padding:10px 14px;margin:10px 0}
.fuenf b{color:#8A5A12}
.fuenf ol{margin:6px 0 0;padding-left:0;list-style:none;display:grid;gap:2px}
.erg{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:#fff}
.erg input{width:160px;font:800 19px "Nunito",sans-serif;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff}
.erg .u{font-weight:800}
.erg.right{border-color:var(--green);background:var(--ok-bg)}
.erg.wrong{border-color:var(--heat);background:var(--bad-bg)}
input:focus{outline:3px solid var(--marker);border-color:var(--ink)}
.fb{margin-top:10px;border-radius:10px;padding:8px 12px}
.fb.ok{background:var(--ok-bg);border:2px solid var(--green)}
.fb.bad{background:var(--bad-bg);border:2px solid var(--heat)}
.tipp{background:#F1EAF8;border:2px solid #B79BD6;border-radius:10px;padding:8px 12px;margin-top:8px}
.tipp b{color:var(--lila)}
.btn.tippbtn{background:#fff;border-color:var(--lila);color:var(--lila);box-shadow:3px 3px 0 var(--lila)}
.btn.tippbtn:disabled{box-shadow:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{border:2px solid var(--ink);background:var(--marker);color:var(--ink);font:800 16px "Nunito",sans-serif;padding:9px 18px;border-radius:10px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);min-height:44px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:#fff;box-shadow:none;font-weight:700}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ideal{margin-top:12px;background:#F2F2F2;border:2px solid #BFBFBF;border-radius:12px;padding:10px 14px}
.ideal h4{margin:0 0 6px;color:var(--dblue);font-size:1rem}
.ideal p{margin:4px 0}
.ideal ul{margin:4px 0;padding-left:1.2em}
.is{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:4px 0}
.is .k{font-weight:800;color:var(--dblue);white-space:nowrap}
.is .zw{grid-column:1/-1;font-weight:800;color:var(--lila);margin-top:4px}
.hin{color:#8A5A12;font-weight:700}
.rate{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rate span{font-weight:800}
.rate button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:700 15px "Nunito",sans-serif;cursor:pointer;min-height:40px;color:var(--ink)}
.rate button.on[data-r="ok"]{border-color:var(--green);background:var(--ok-bg)}
.rate button.on[data-r="teil"]{border-color:#B8860B;background:#FFF6D6}
.rate button.on[data-r="nein"]{border-color:var(--heat);background:var(--bad-bg)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.sumrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 2px}
.ampel{font-weight:800;border-radius:999px;padding:2px 12px;white-space:nowrap}
.ampel.g{background:var(--ok-bg);color:var(--green)}
.ampel.y{background:#FFF6D6;color:#8A6A00}
.ampel.r{background:var(--bad-bg);color:var(--heat)}
.ampel.o{background:#F2F2F2;color:var(--muted)}
.bar{height:16px;border-radius:999px;background:#EEF2F8;overflow:hidden;border:1.5px solid var(--line);margin:8px 0}
.bar i{display:block;height:100%;background:var(--green)}
.foot{margin-top:28px;font-size:.88rem;color:var(--muted)}
.foot a{color:var(--muted)}
@media (max-width:560px){h1{font-size:2rem}}
</style>

<div class="wrap">
  <h1>Fit für die Klassenarbeit: Energie</h1>
  <p class="sub">Physik Klasse 8 · Aufgaben auf Papier lösen, dann mit der Ideallösung vergleichen</p>
  <section id="view"></section>
  <p class="foot">Fehling · Fit für die Klassenarbeit: Energie · <a href="versuch.html">Versuchslabor</a> · <a href="https://maltefehling.github.io/energiefluss/">alle Energie-Apps</a></p>
</div>

<script>
"use strict";
/* ============ Hilfsfunktionen ============ */
// Zufallszahl a…b in Schritten s – jede Aufgabe hat feste Bereiche, damit das Niveau bei jedem Durchgang gleich bleibt
const R=(a,b,s=1)=>+(a+s*Math.floor(Math.random()*(Math.floor((b-a)/s+1e-9)+1))).toFixed(6);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const V=(...fs)=>pick(fs)();               // eine von mehreren Kontext-Varianten
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(a,n)=>shuffle(a).slice(0,n);
const g=9.81;
const rd=(x,d=2)=>Math.round(x*10**d)/10**d;
function f(x,d=2){const r=rd(x,d);let [i,fr]=Math.abs(r).toFixed(d).split('.');fr=(fr||'').replace(/0+$/,'');
  i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (r<0?'−':'')+i+(fr?','+fr:'');}
const eu=x=>{const [i,c]=x.toFixed(2).split('.');return i+','+c+' €';};
const E=s=>`E<sub>${s}</sub>`;
const eq=x=>Math.abs(x-rd(x))>1e-9?'≈':'=';
const ZU=E('zu'),NU=E('nutz'),EN=E('entw'),EP=E('pot');
const KOMP={S:'Sachkompetenz',E:'Erkenntnisgewinnung',K:'Kommunikation',B:'Bewertung'};
const cap=s=>s[0].toUpperCase()+s.slice(1);
const low=s=>s[0].toLowerCase()+s.slice(1);

/* ============ Grafiken ============ */
// Energieflussdiagramm: Breiten (bz, bn, bw) unabhängig von den Beschriftungen, damit auch „falsche“ Diagramme möglich sind
function sankey(o){
  const s=o.s||1, H=o.bz*s, hn=o.bn*s, hw=o.bw*s, y0=30, xJ=170;
  const yc=y0+hn+hw/2, Rr=26+hw/2, xd=xJ+30+Rr, yEnd=y0+H+70;
  const W=o.w||420, Ht=yEnd+64, bw2=Math.max(26,(o.dev||'').length*4.4+8);
  return `<svg viewBox="0 0 ${W} ${Ht}" width="${W}" role="img" aria-label="Energieflussdiagramm">
  <line x1="18" y1="${y0+H/2}" x2="${xJ}" y2="${y0+H/2}" stroke="#3B6FB6" stroke-width="${H}"/>
  <line x1="${xJ}" y1="${y0+hn/2}" x2="${xJ+150}" y2="${y0+hn/2}" stroke="#2E9E5B" stroke-width="${hn}"/>
  <polygon points="${xJ+150},${y0-9} ${xJ+150},${y0+hn+9} ${xJ+178},${y0+hn/2}" fill="#2E9E5B"/>
  <path d="M${xJ} ${yc} L${xJ+30} ${yc} A${Rr} ${Rr} 0 0 1 ${xd} ${yc+Rr} L${xd} ${yEnd}" fill="none" stroke="#E4572E" stroke-width="${hw}"/>
  <polygon points="${xd-hw/2-9},${yEnd} ${xd+hw/2+9},${yEnd} ${xd},${yEnd+24}" fill="#E4572E"/>
  <rect x="${xJ-bw2}" y="${y0-14}" width="${2*bw2}" height="${H+28}" rx="8" fill="#fff" stroke="#1F2A44" stroke-width="2"/>
  <text x="${xJ}" y="${y0+H/2+5}" text-anchor="middle" font-size="13" font-weight="800" fill="#1F2A44">${o.dev||''}</text>
  <text x="18" y="${y0+H+32}" font-size="13" font-weight="800" fill="#3B6FB6">${o.lz}</text>
  <text x="${xJ+44}" y="${y0-8}" font-size="14" font-weight="800" fill="#2E9E5B">${o.ln}</text>
  <text x="${xd+hw/2+14}" y="${yEnd+4}" font-size="14" font-weight="800" fill="#E4572E">${o.lw}</text>
  </svg>`;}
function halfpipe(cap){
  const P=[[60,40],[86,128],[220,186],[354,128],[380,40]];
  return `<svg viewBox="0 0 440 200" width="440" role="img" aria-label="U-förmige Bahn mit den Punkten 1 bis 5">
  <path d="M40 30 L60 30 C60 210 380 210 380 30 L400 30" fill="none" stroke="#1F2A44" stroke-width="5" stroke-linecap="round"/>
  ${P.map((p,i)=>`<circle cx="${p[0]+(i<2?14:i>2?-14:0)}" cy="${p[1]-(i==2?14:6)}" r="13" fill="#FFD447" stroke="#1F2A44" stroke-width="2"/><text x="${p[0]+(i<2?14:i>2?-14:0)}" y="${p[1]-(i==2?14:6)+5}" text-anchor="middle" font-weight="800" font-size="15">${i+1}</text>`).join('')}
</svg>`;}
const BAHN=()=>pick([{n:'einen Skater in einer Halfpipe',c:'Der Skater startet an Punkt 1 aus dem Stand.'},{n:'eine Murmel in einer Schüssel',c:'Die Murmel wird an Punkt 1 losgelassen.'},{n:'einen Wagen auf einer U-förmigen Bahn',c:'Der Wagen startet an Punkt 1 aus dem Stand.'}]);

/* ============ Aufgabentypen (alles wird auf Papier gelöst) ============
 mc: opts[], richtig (Index oder […] mit multi)   select: rows[{l,opts,r}]   zahl: rows[{l,w,u}]
 offen: ideal, krit[]   rechnen: text, frage, geg[], ges, schritte[{t?,formel,rechnung[]}], antwort, hin
 einheit: material + teile[] (Aufgabe mit Material wie beim IQB)                                       */
const opt8=['kinetische Energie (Bewegungsenergie)','potenzielle Energie (Lageenergie)','Spannenergie','thermische Energie (Wärmeenergie)','elektrische Energie','chemische Energie','Strahlungsenergie (Licht)','Kernenergie'];
const optU=['elektrische Energie','chemische Energie','kinetische Energie','potenzielle Energie','thermische Energie (Wärme)','Strahlungsenergie (Licht)','Spannenergie'];
const RE=o=>({typ:'rechnen',punkte:o.punkte||3,...o});
/* ---------- Ergebnis prüfen und auf typische Fehler zurückschließen ---------- */
const UM='Formel falsch umgestellt? Die gesuchte Größe muss allein vorne stehen – prüf Schritt ③.';
const BRUCH=`Bruch umgedreht? Beim Wirkungsgrad steht die Nutzenergie oben: η = ${'E<sub>nutz</sub>'} : ${'E<sub>zu</sub>'}.`;
const EINE='Du hast nur eine Energiequelle genommen – zugeführt werden beide zusammen.';
const ZW=x=>`Das ist nur das Zwischenergebnis (${x}). Rechne weiter!`;
// Zielgröße = E : (a · b) – typische Umstell- und Vergessensfehler als Zahlenwerte
const umst=(E,a,b,la,lb)=>[[E*a/b,UM],[E*b/a,UM],[a*b/E,UM],[E*a*b,UM],[E/a,lb+' vergessen?'],[E/b,la+' vergessen?']];
function parseDE(s){s=String(s||'').trim().replace(/[\s ]/g,'').replace(/[−–]/g,'-').replace(/[^\d,.\-]/g,'');
  if(!s)return NaN; if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,''); return Number(s.replace(',','.'));}
const nah=(x,w)=>isFinite(x)&&Math.abs(x-w)<=Math.max(0.011,Math.abs(w)*0.01);
const FAKT=[[1000,'1 000-mal','kJ ↔ J, kW ↔ W, g ↔ kg oder t ↔ kg nicht umgerechnet?'],[1e6,'1 000 000-mal','zweimal 1 000 vergessen – z. B. kJ und g gleichzeitig?'],[60000,'60 000-mal','kW → W und min → s umrechnen!'],
 [100,'100-mal','cm ↔ m umgerechnet? Oder Prozent ↔ Dezimalzahl verwechselt?'],[60,'60-mal','min ↔ s umgerechnet? (1 min = 60 s)'],[3600,'3 600-mal','h ↔ s umgerechnet? (1 h = 3 600 s)'],[10,'10-mal','Komma verrutscht oder Zehnerpotenz falsch?'],[g,'9,81-mal','Ortsfaktor g vergessen oder doppelt genommen?']];
function diagnose(t,v){const w=t.erg.w;
 if(nah(v,w))return {ok:true};
 for(const [x,m] of t.F||[])if(nah(v,x))return {ok:false,m};
 if(t.erg.u==='%'&&nah(v*100,w))return {ok:false,m:'Du hast η als Dezimalzahl angegeben – gefragt ist Prozent (mal 100).'};
 const r=v/w;for(const [k,txt,m] of FAKT){if(nah(r,k))return {ok:false,m:`Dein Ergebnis ist ${txt} zu groß: ${m}`};if(nah(1/r,k))return {ok:false,m:`Dein Ergebnis ist ${txt} zu klein: ${m}`};}
 for(const [x,m] of t.F||[])for(const k of [1000,100,60])if(nah(v,x*k)||nah(v,x/k))return {ok:false,m:m+' Außerdem stimmt eine Einheit nicht.'};
 return {ok:false,m:'Prüf Schritt für Schritt: richtige Formel? richtig umgestellt? alle Einheiten umgerechnet? richtig in den Taschenrechner getippt?'};}

/* ---------- Rechenaufgaben: Wirkungsgrad (6) ---------- */
const GER6=[
 {n:'Ein Elektromotor',gen:'des Elektromotors',zu:'elektrische Energie',nutz:'Bewegungsenergie',min:70,max:90},
 {n:'Eine Bohrmaschine',gen:'der Bohrmaschine',zu:'elektrische Energie',nutz:'Bewegungsenergie',min:60,max:80},
 {n:'Ein Automotor',gen:'des Automotors',zu:'chemische Energie aus Benzin',nutz:'Bewegungsenergie',min:20,max:35},
 {n:'Eine LED-Lampe',gen:'der LED-Lampe',zu:'elektrische Energie',nutz:'Licht',min:30,max:45},
 {n:'Ein Wasserkocher',gen:'des Wasserkochers',zu:'elektrische Energie',nutz:'thermische Energie des Wassers',min:85,max:95},
 {n:'Ein Dieselmotor im Zug',gen:'des Dieselmotors',zu:'chemische Energie aus Diesel',nutz:'Bewegungsenergie',min:30,max:40},
 {n:'Ein Fahrraddynamo',gen:'des Dynamos',zu:'Bewegungsenergie',nutz:'elektrische Energie',min:50,max:70}];
function w6a(){const d=pick(GER6),Z=R(2,10)*100,eta=R(d.min,d.max,5),N=Z*eta/100;
 return RE({titel:'Wirkungsgrad berechnen',text:`${d.n} bekommt die zugeführte Energie <b>${ZU} = ${f(Z)} J</b> (${d.zu}). Davon werden <b>${NU} = ${f(N)} J</b> in ${d.nutz} umgewandelt.`,
 frage:`Berechne den Wirkungsgrad <b>η</b> ${d.gen}.`,geg:[`${ZU} = ${f(Z)} J`,`${NU} = ${f(N)} J`],ges:'η in %',
 schritte:[{formel:`η = ${NU} : ${ZU}`,rechnung:[`η = ${f(N)} J : ${f(Z)} J`,`η = ${f(eta/100)} = ${f(eta)} %`]}],
 erg:{w:eta,u:'%',l:'η'},F:[[Z/N*100,BRUCH]],antwort:`Der Wirkungsgrad ${d.gen} beträgt η = ${f(eta)} %.`});}
function w6b(){const d=pick([{n:'Ein Ladegerät',nutz:'chemische Energie im Akku'},{n:'Ein Elektromotor',nutz:'Bewegungsenergie'},{n:'Ein Netzteil',nutz:'elektrische Energie für den Laptop'},{n:'Eine Wasserpumpe',nutz:'potenzielle Energie des Wassers'}]);
 const eta=pick([60,70,75,80,85,90]),Z=R(2,10)*100,N=Z*eta/100;
 return RE({titel:'Formel umstellen: Nutzenergie',text:`${d.n} hat den Wirkungsgrad <b>η = ${eta} %</b> und bekommt die zugeführte Energie <b>${ZU} = ${f(Z)} J</b>. Die Nutzenergie ist ${d.nutz}.`,
 frage:`Berechne die Nutzenergie <b>${NU}</b>.`,geg:[`η = ${eta} % = ${f(eta/100)}`,`${ZU} = ${f(Z)} J`],ges:`${NU} in J`,

  {t:'Wirkungsgrad',formel:`η = ${NU} : ${ZU} = ${EP} : ${ZU}`,rechnung:[`η = ${f(Ep)} J : ${f(Zk*1000)} J`,`η ${eq(e)} ${f(e/100,4)} = ${f(e)} %`]}],

function p7h(){const m1=R(45,70),m2=R(4,10),tal=R(900,1300,10),dh=R(400,900,10),gip=tal+dh,w=R(5,12),st=R(2,5),Ep=(m1+m2)*g*dh,v=pick([

function p7i(){const food=pick([['Ein Schokoriegel',R(800,1200,50)],['Eine Portion Nudeln',R(1600,2400,100)],['Eine Banane',R(350,450,10)],['Ein Müsliriegel',R(400,600,20)]]),Ek=food[1],m=pick([50,55,60]),eta=pick([20,25]),N=eta/100*Ek*1000,h=N/(m*g),p=pick(['Ein Bergsteiger','Eine Wanderin','Ein Treppenläufer']);

 schritte:[{t:'Zwischenschritt: Nutzenergie',formel:`${NU} = η · ${ZU}`,rechnung:[`${NU} = ${f(eta/100)} · ${f(Ek*1000)} J = ${f(N)} J`]},
  {t:'Höhe (die Nutzenergie wird zu potenzieller Energie)',formel:`h = ${EP} : (m · g)`,rechnung:[`h = ${f(N)} J : (${m} kg · 9,81 N/kg)`,`h ${eq(h)} ${f(h)} m`]}],

 richtigesDiagramm:()=>{const v=pick([{d:'Dynamo',t:'Ein Fahrraddynamo bekommt 100 J kinetische Energie und gibt {N} J elektrische Energie ab.'},{d:'Motor',t:'Ein Elektromotor bekommt 100 J elektrische Energie und gibt {N} J Bewegungsenergie ab.'},{d:'LED',t:'Eine LED-Lampe bekommt 100 J elektrische Energie und gibt {N} J Licht ab.'}]);

   erkl:D.map((d,i)=>`<b>${LET[i]}</b>: `+(d.k===1?`richtig – 100 J = ${p} J + ${q} J, und die Pfeilbreiten passen.`:d.k===2?`falsch – es käme mehr heraus (${2*p} J), als hineingeht.`:`falsch – der ${p}-J-Pfeil ist schmaler gezeichnet als der ${q}-J-Pfeil.`)).join('<br>')};},
 erfinder:()=>{const v=pick([['neuer Motor','elektrischer Energie','Bewegungsenergie'],['neue Glühlampe','elektrischer Energie','Licht'],['neuer Dynamo','Bewegungsenergie','elektrische Energie']]),Z=pick([100,200,500]),X=Z*pick([1.1,1.2,1.5]);
   return {typ:'offen',titel:'Stimmt das?',punkte:2,frage:`Ein Erfinder behauptet: „Mein ${v[0]} macht aus ${Z} J ${v[1]} ${f(X)} J ${v[2]}.“ Nimm Stellung und begründe mit dem Energieerhaltungssatz.`,
   ideal:`Das <b>kann nicht stimmen</b>. Nach dem Energieerhaltungssatz kann keine Energie erzeugt werden – es kann höchstens so viel herauskommen, wie hineingeht. Da immer ein Teil entwertet wird (Wärme), kommen sogar <b>weniger als ${Z} J</b> Nutzenergie heraus. Eine solche Maschine wäre ein Perpetuum mobile.`,krit:['kann nicht stimmen','Energie kann nicht erzeugt werden',`immer Entwertung → weniger als ${Z} J`]};},
 jeGroesser:()=>({typ:'mc',multi:true,titel:'Was bedeutet ein großer Wirkungsgrad?',frage:'Je größer der Wirkungsgrad ist, desto … Notiere <b>alle</b> richtigen Buchstaben.',...mcMulti([[1,'… weniger Energie braucht man, um das gewünschte Ziel zu erreichen.'],[0,'… mehr Energie wird entwertet.'],[1,'… effizienter ist die Energieumwandlung.'],[0,'… wärmer wird bei der Energieumwandlung die Umgebung.']])}),
 typischEta:()=>({typ:'select',titel:'Typische Wirkungsgrade',frage:'Ordne ungefähr zu.',rows:shuffle([{l:'Glühlampe',opts:['etwa 5 %','etwa 30 %','etwa 90 %'],r:'etwa 5 %'},{l:'Verbrennungsmotor (Auto)',opts:['etwa 5 %','etwa 30 %','etwa 90 %'],r:'etwa 30 %'},{l:'Elektromotor',opts:['etwa 5 %','etwa 30 %','etwa 90 %'],r:'etwa 90 %'}])}),
 unter100:()=>({typ:'offen',titel:'Immer unter 100 %',punkte:2,frage:`Begründe, warum der Wirkungsgrad ${pick(['eines Geräts','eines Automotors','einer Lampe','eines Kraftwerks'])} immer kleiner als 100 % ist.`,

 getriebe:()=>{const v=pick([['Das Getriebe eines Autos ist schlecht geölt. Dadurch nimmt die Reibung zwischen den beweglichen Teilen stark zu.','das Auto braucht für dieselbe Fahrt mehr Benzin'],['Die Kette eines E-Bikes ist verrostet und quietscht. Dadurch nimmt die Reibung stark zu.','der Akku ist schneller leer'],['Die Lager eines Ventilators sind verschmutzt. Dadurch nimmt die Reibung stark zu.','der Ventilator braucht für denselben Luftstrom mehr Strom']]);

 epotAbh:()=>({typ:'mc',multi:true,titel:'Wovon hängt die potenzielle Energie ab?',frage:'Notiere <b>alle</b> Größen, von denen die potenzielle Energie eines Körpers abhängt.',...mcMulti([[1,'Masse m'],[1,'Höhe h'],[1,'Ortsfaktor g'],[0,'Geschwindigkeit'],[0,'Temperatur']]),erkl:`${EP} = m · g · h: Je schwerer und je höher, desto mehr potenzielle Energie. Auf dem Mond (kleineres g) wäre sie kleiner.`}),

 leistungZeichen:()=>({typ:'select',titel:'Formelzeichen und Einheit der Leistung',frage:'Ergänze.',rows:shuffle([{l:'Formelzeichen der Leistung',opts:['L','P','E','W'],r:'P'},{l:'Einheit der Leistung',opts:['Joule (J)','Watt (W)','Newton (N)','Sekunde (s)'],r:'Watt (W)'},{l:'1 W = …',opts:['1 J pro s','1 s pro J','1 000 J','1 J · s'],r:'1 J pro s'},{l:'1 kW = …',opts:['10 W','100 W','1 000 W'],r:'1 000 W'}])}),
 vergleich:()=>{const a=R(15,30),k=pick([2,3]),v=pick([[`Lena und Tom sind gleich schwer und laufen dieselbe Treppe hoch. Lena braucht ${a} s, Tom ${a*k} s.`,'Lena','gleiche Masse, gleiche Höhe'],[`Zwei Kräne heben gleich schwere Paletten gleich hoch. Kran A braucht ${a} s, Kran B ${a*k} s.`,'Kran A','gleiche Masse, gleiche Höhe'],[`Zwei Wasserkocher erhitzen gleich viel Wasser gleich stark. Kocher A braucht ${a*10} s, Kocher B ${a*10*k} s.`,'Kocher A','gleiche Wassermenge, gleiche Erwärmung']]);

   return {typ:'offen',titel:'Gleiche Energie, andere Leistung',punkte:2,frage:v[0]+' Vergleiche die umgewandelte Energie und die Leistung.',
   ideal:`Beide wandeln <b>gleich viel Energie</b> um (${v[2]}). ${v[1]} braucht nur ${z}, also ist die <b>Leistung ${m} so groß</b> (P = E : t).`,krit:['gleiche Energie',`${v[1]} hat die größere Leistung`,`${m} so groß, Begründung mit P = E : t`]};},
};

/* ---------- Aufgaben mit Material (IQB-Stil): Kontext und Zahlen wechseln, Anforderung bleibt gleich ---------- */
const MZ=(k,afb,t)=>({k,afb,...t});
const IQB={
 // drei Geräte mit gleicher Nutzenergie: ablesen, Wirkungsgrad, Erklärung, Kaufentscheidung
 vergleich3:{bereich:6,make:()=>{
  if(Math.random()<.5){const L=pick([3,4,5]),led=pick([2.5,4]);
   return {titel:'Lampen im Vergleich',nutz:L,nw:'Licht',G:[{n:'Glühlampe',z:L*20,life:1000,p:pick([1,1.5,2])},{n:'Halogenlampe',z:L*10,life:2000,p:3},{n:'LED-Lampe',z:L*led,life:pick([10000,15000,20000]),p:pick([5,6,8])}],gleich:'Alle drei Lampen sind gleich hell',lu:'h',ein:'Lampe',alle:'gleich hell sind'};}
  const N=pick([40,50,60]);
  return {titel:'Gartenpumpen im Vergleich',nutz:N,nw:'potenzielle Energie (Wasser wird hochgepumpt)',G:[{n:'Pumpe A',z:N*5,life:2,p:pick([20,25,30])},{n:'Pumpe B',z:N*2.5,life:4,p:50},{n:'Pumpe C',z:N*1.25,life:pick([8,10]),p:pick([100,120])}],gleich:'Alle drei Pumpen pumpen gleich viel Wasser gleich hoch',lu:'Jahre',ein:'Pumpe',alle:'gleich viel Wasser pumpen'};},
  build:d=>{const [A,B,C]=d.G,eta=x=>d.nutz/x.z*100,anz=C.life/A.life;
   const mat=`<div class="ml">Material</div>${d.gleich}: Jede gibt pro Sekunde <b>${f(d.nutz)} J</b> ${d.nw} ab.
   <table class="t"><tr><th>${d.ein}</th><th>zugeführte elektrische Energie pro Sekunde</th><th>Lebensdauer</th><th>Preis</th></tr>${d.G.map(x=>`<tr><td>${x.n}</td><td class="n">${f(x.z)} J</td><td class="n">${f(x.life)} ${d.lu}</td><td class="n">${eu(x.p)}</td></tr>`).join('')}</table>`;
   return {mat,T:[
    MZ('K','I',{tipp:`Such in der Tabelle die Zeile „${B.n}“ und die Spalte „zugeführte elektrische Energie“.`,niv:[1,2],typ:'mc',frage:`Wie viel elektrische Energie bekommt die ${B.n} pro Sekunde?`,...mcOk(`${f(B.z)} J`,[`${f(d.nutz)} J`,`${f(A.z)} J`,`${f(C.z)} J`])}),
    MZ('S','II',{tipp:'Die Nutzenergie steht über der Tabelle (pro Sekunde abgegeben), die zugeführte Energie in der Tabelle. Dann η = Nutzenergie : zugeführte Energie, mal 100.',niv:[1],typ:'zahl',frage:`Berechne den Wirkungsgrad der ${C.n} mit η = ${NU} : ${ZU}.`,rows:[{l:'η =',w:eta(C),u:'%'}],erkl:`η = ${f(d.nutz)} J : ${f(C.z)} J = ${f(eta(C)/100,4)} = ${f(eta(C))} %`}),
    MZ('S','II',{tipp:'Die Nutzenergie steht über der Tabelle (pro Sekunde abgegeben), die zugeführte Energie in der Tabelle. Dann η = Nutzenergie : zugeführte Energie, mal 100.',niv:[2,3],typ:'zahl',frage:`Berechne die Wirkungsgrade der ${A.n} und der ${C.n}.`,rows:[{l:`η ${A.n} =`,w:eta(A),u:'%'},{l:`η ${C.n} =`,w:eta(C),u:'%'}],erkl:`${A.n}: η = ${f(d.nutz)} J : ${f(A.z)} J = ${f(eta(A))} % · ${C.n}: η = ${f(d.nutz)} J : ${f(C.z)} J = ${f(eta(C))} %`}),
    MZ('S','II',{tipp:'Es kommt bei allen gleich viel Nutzenergie heraus. Wohin geht der Rest der zugeführten Energie?',niv:[1],typ:'mc',frage:`Warum braucht die ${A.n} so viel mehr Energie, obwohl alle ${d.alle}?`,...mcOk('Sie wandelt den größten Teil der Energie in Wärme um.',[`Sie gibt mehr ${d.nw.split(' (')[0]} ab.`,'Sie vernichtet Energie.','Sie hält länger.'])}),
    MZ('K','II',{tipp:'Vergleiche die Nutzenergie mit der zugeführten Energie. Was passiert mit der Differenz – und was heißt das für den Wirkungsgrad?',niv:[2],typ:'offen',frage:`Erkläre mithilfe des Materials, warum die ${A.n} viel mehr Energie braucht als die ${C.n}.`,ideal:`Beide geben nur ${f(d.nutz)} J pro Sekunde ab. Die ${A.n} bekommt aber ${f(A.z)} J. Die restlichen ${f(A.z-d.nutz)} J werden in <b>Wärme</b> umgewandelt und sind entwertet. Ihr Wirkungsgrad ist deshalb sehr klein (${f(eta(A))} %).`,krit:[`gleiche Nutzenergie ${f(d.nutz)} J`,'Rest wird zu Wärme (entwertet)','kleiner Wirkungsgrad']}),
    MZ('B','III',{tipp:'Nimm mindestens zwei Spalten der Tabelle als Kriterien: Preis, Lebensdauer, Energiebedarf. Wie viele billige Geräte bräuchte man in der Lebensdauer des teuersten? Schreib am Ende dein Urteil.',niv:[2,3],typ:'offen',punkte:3,frage:`Opa sagt: „Die ${A.n} ist am billigsten, die kaufe ich.“ Beurteile seine Aussage. Nutze mindestens zwei Kriterien aus dem Material.`,
     ideal:`Beim <b>Kaufpreis</b> hat Opa recht (${eu(A.p)} statt ${eu(C.p)}). Aber: Die ${C.n} hält ${f(C.life)} ${d.lu} – in dieser Zeit bräuchte man <b>${f(anz)} Stück</b> der ${A.n} (${eu(anz*A.p)}). Außerdem braucht die ${A.n} pro Sekunde <b>${f(A.z)} J statt ${f(C.z)} J</b>, also ${f(A.z/C.z)}-mal so viel elektrische Energie – das kostet Strom und belastet die Umwelt.<br><b>Urteil:</b> Nur auf den Kaufpreis zu schauen, ist kein gutes Kriterium. Auf Dauer ist die ${C.n} sparsamer${anz*A.p>C.p?' und sogar günstiger':''}.`,
     krit:['Kriterium Kaufpreis',`Kriterium Lebensdauer (${f(anz)} Stück)`,`Kriterium Energiebedarf (${f(A.z)} J statt ${f(C.z)} J)`,'eigenes, begründetes Urteil']})]};}},
 // Höhe nimmt ab: Beobachtung, Erklärung, Experiment planen
 abnahme:{bereich:4,make:()=>{
  if(Math.random()<.5){const h0=pick([20,24,30]),q=pick([.92,.94]);return {titel:'Das Pendel wird langsamer',h:[0,1,2,3,4,5].map(i=>rd(h0*q**i,1)),txt:'Ole lässt ein Fadenpendel schwingen. Nach jeder Schwingung misst er, wie hoch die Kugel am Umkehrpunkt noch steigt.',sp:'Schwingung',ding:'die Kugel',wer:'Ole',hyp:'„Mit einer schwereren Kugel nimmt die Höhe langsamer ab.“',vari:'Masse der Kugel',konst:'gleiche Fadenlänge, gleiche Starthöhe, gleiche Größe und Form der Kugel (z. B. Holz- und Stahlkugel gleicher Größe)',erkl:'Durch Luftreibung wird ein Teil der Energie in Wärme umgewandelt.',wo:'(Luft, Aufhängung)'};}
  const h0=pick([100,120,150]),q=pick([.75,.8]);return {titel:'Der Flummi springt immer niedriger',h:[0,1,2,3,4,5].map(i=>rd(h0*q**i,1)),txt:'Mara lässt einen Flummi auf den Boden fallen. Nach jedem Aufprall misst sie, wie hoch er wieder springt.',sp:'Aufprall',ding:'der Flummi',wer:'Mara',hyp:'„Auf einem Holzboden springt der Flummi höher als auf einem Teppich.“',vari:'Art des Bodens',konst:'gleicher Flummi, gleiche Fallhöhe, fallen lassen statt werfen',erkl:'Beim Aufprall wird ein Teil der Energie in Wärme umgewandelt.',wo:'(Verformung beim Aufprall, Luft)'};},
  build:d=>{const H=d.h,ab=H[0]-H[5],mat=`<div class="ml">Material: Messung von ${d.wer}</div>${d.txt}<table class="t"><tr><th>${d.sp}</th>${H.map((_,i)=>`<td class="n">${i}</td>`).join('')}</tr><tr><th>Höhe in cm</th>${H.map(x=>`<td class="n">${f(x,1)}</td>`).join('')}</tr></table>`;
   return {mat,T:[
    MZ('E','I',{tipp:'Lies die Höhen in der Tabelle von links nach rechts.',niv:[1,2,3],typ:'mc',frage:`Was beobachtet ${d.wer}?`,...mcOk('Die Höhe nimmt mit jedem Mal ab.',['Die Höhe bleibt gleich.','Die Höhe nimmt zu.','Die Höhe schwankt zufällig.'])}),
    MZ('E','I',{tipp:'Erste Höhe minus letzte Höhe.',niv:[1],typ:'zahl',frage:`Um wie viele Zentimeter hat die Höhe bis zum 5. Mal insgesamt abgenommen?`,rows:[{l:'Abnahme:',w:ab,u:'cm'}],erkl:`${f(H[0],1)} cm − ${f(H[5],1)} cm = ${f(ab,1)} cm`}),
    MZ('E','II',{tipp:'Eine Beobachtung ist das, was man misst oder sieht (Zahlen aus der Tabelle). Eine Erklärung sagt, warum es so ist.',niv:[1,2],typ:'select',frage:'Ist die Aussage eine Beobachtung (Messwert) oder eine Erklärung (Deutung)?',rows:shuffle([
     {l:`Beim 5. Mal kommt ${d.ding} nur noch ${f(H[5],1)} cm hoch.`,opts:['Beobachtung','Erklärung'],r:'Beobachtung'},{l:d.erkl,opts:['Beobachtung','Erklärung'],r:'Erklärung'},
     {l:`Die Höhe nimmt von ${f(H[0],1)} cm auf ${f(H[1],1)} cm ab.`,opts:['Beobachtung','Erklärung'],r:'Beobachtung'},{l:`Weil die Höhe abnimmt, hat ${d.ding} oben weniger potenzielle Energie.`,opts:['Beobachtung','Erklärung'],r:'Erklärung'}])}),
    MZ('S','II',{tipp:'Geht die Energie wirklich verloren? Wohin geht sie? Verwende das Wort „entwertet“.',niv:[2,3],typ:'offen',frage:`Max sagt: „${cap(d.ding)} verliert Energie – also stimmt der Energieerhaltungssatz nicht.“ Nimm Stellung.`,
     ideal:`Max hat <b>nicht recht</b>. Die Energie geht nicht verloren: Durch Reibung ${d.wo} wird ein Teil in <b>Wärme</b> umgewandelt und an die Umgebung abgegeben. Für die Bewegung ist diese Energie <b>entwertet</b>, deshalb wird die Höhe kleiner. Insgesamt bleibt die Energie erhalten.`,krit:['Max hat nicht recht','Umwandlung in Wärme','Energie bleibt insgesamt erhalten / entwertet']}),
    MZ('E','III',{tipp:'Ein fairer Versuch: nur eine Sache verändern, alles andere gleich lassen. Was misst du – und wie oft?',niv:[3],typ:'offen',punkte:3,frage:`${d.wer} vermutet: ${d.hyp} Beschreibe ein Experiment, mit dem die Vermutung geprüft werden kann.`,
     ideal:`Man verändert <b>nur eine Größe: die ${d.vari}</b>. Alles andere bleibt gleich: ${d.konst}. Man misst bei beiden Versuchen die Höhen wie in der Tabelle und vergleicht sie. Die Messung wird mehrmals wiederholt. Passen die Ergebnisse zur Vermutung, ist sie gestützt.`,
     krit:[`nur die ${d.vari} verändern`,'alles andere gleich halten','Höhen messen und vergleichen','Messung wiederholen']})]};}},
 // Perpetuum mobile in der Werbung
 wunder:{bereich:5,make:()=>{const X=pick([50,100,200]),k=pick([1.5,2,3]);return pick([
   {titel:'Der Wundermotor',X,ad:`<b>NEU! FreeMag 3000</b>Einmal mit ${X} J anstoßen – danach liefert der Magnetmotor <u>jede Sekunde ${f(X*k)} J</u> elektrische Energie. Ganz ohne Steckdose, ohne Benzin, ohne Sonne!<br><small>Über 10 000 zufriedene Kunden!</small>`,
    wid:`Er liefert jede Sekunde ${f(X*k)} J – ohne dass Energie zugeführt wird.`,neben:[`Er braucht einen Anstoß von ${X} J.`,'Er liefert elektrische Energie.','Über 10 000 zufriedene Kunden.'],beleg:'„Über 10 000 zufriedene Kunden“',ding:'den FreeMag 3000'},
   {titel:'Das Endlos-E-Bike',X,ad:`<b>Das E-Bike, das nie leer wird!</b>Der Dynamo im Vorderrad lädt beim Fahren den Akku – jede Sekunde mit ${f(X*k)} J. Der Motor braucht nur ${X} J pro Sekunde. So fährt das Rad ewig, ohne Treten und ohne Steckdose!<br><small>Ein bekannter Influencer hat es getestet!</small>`,
    wid:`Der Dynamo lädt mehr Energie in den Akku (${f(X*k)} J), als der Motor braucht (${X} J) – ohne Treten.`,neben:['Das E-Bike hat einen Akku.','Im Vorderrad ist ein Dynamo.','Ein Influencer hat es getestet.'],beleg:'„Ein bekannter Influencer hat es getestet“',ding:'das Endlos-E-Bike'}]);},

    MZ('S','II',{tipp:'Zugeführte Energie = Nutzenergie + Wärme – und ein bisschen Wärme entsteht immer.',niv:[1,2],typ:'mc',frage:`Ein echtes Gerät bekommt ${X} J. Welcher Energiefluss ist möglich?`,...mcOk(`${X} J → ${f(X*.7)} J Nutzenergie + ${f(X*.3)} J Wärme`,[`${X} J → ${f(X*1.5)} J Nutzenergie`,`${X} J → ${X} J Nutzenergie + ${f(X*.2)} J Wärme`,`${X} J → ${X} J Nutzenergie, keine Wärme`]),erkl:'Zugeführte Energie = Nutzenergie + entwertete Energie, und es wird immer etwas entwertet.'}),

function klassenarbeit(n){const L=[];for(const b of BER)for(const t of b.ka(n))L.push({...t,bereich:b.nr});L.push(iqb(pick(Object.keys(IQB)),n));return L;}

// Tipps einer Teilaufgabe: eigene Tipps, sonst aus der Rechnung abgeleitet (gestuft)
function tipps(t){
 if(t.typ==='rechnen'){const L=[`Gesucht ist <b>${t.ges}</b>. Schreib zuerst ① gegeben: alle Größen mit Formelzeichen und Einheit.`];
  const um=t.geg.filter(x=>(x.match(/=/g)||[]).length>1);if(um.length)L.push('Erst umrechnen: '+um.join(' · '));
  if(t.schritte.length>1)L.push(`Das geht in ${t.schritte.length} Schritten. Rechne zuerst: ${t.schritte[0].t.replace('Zwischenschritt: ','')}. Formel: ${t.schritte[0].formel}`);
  L.push(`Diese Formel brauchst du${t.schritte.length>1?' danach':''}: ${t.schritte[t.schritte.length-1].formel}`);
  if(t.hin)L.push(t.hin);return L;}
 const x=t.tipp||TIPP[t.titel]||(t.titel&&t.titel.startsWith('Umwandlungskette')?TIPP_KETTE:null);
 return x?[].concat(x):['Lies die Aufgabe noch einmal genau und unterstreiche die wichtigen Wörter.'];}
const sameOpts=rows=>rows.every(r=>r.opts.join('|')===rows[0].opts.join('|'));
function subHTML(t,k,lab){
 let h=`<div class="teil" id="s${k}">${lab?`<div class="tl">${lab}</div>`:''}`;
 if(t.svg)h+=`<div class="svgbox">${t.svg}</div>`;
 if(t.typ==='rechnen')h+=`<p>${t.text}</p><p class="q">${t.frage}</p>${FUENF}<div class="erg"><span>Dein Endergebnis: <b>${t.erg.l} =</b></span><input inputmode="decimal" autocomplete="off" aria-label="Endergebnis"><span class="u">${t.erg.u}</span><button class="btn" data-a="check">Prüfen</button></div><div class="fbx"></div>`;
 else{h+=`<p class="q">${t.frage}</p>`;
  if(t.typ==='mc')h+=`<ul class="mcl ${t.diag?'diag':''}">${t.opts.map((o,i)=>`<li><b class="L">${LET[i]})</b><span>${o}</span></li>`).join('')}</ul><p class="note">${t.multi?'Mehrere Buchstaben können richtig sein. ':''}Notiere ${t.multi?'die Buchstaben':'den Buchstaben'} auf deinem Papier.</p>`;
  if(t.typ==='select'){const same=sameOpts(t.rows);
   if(same)h+=`<div class="auswahl">${t.rows[0].opts.map(o=>`<span>${o}</span>`).join('')}</div>`;
   h+=`<div class="zr">${t.rows.map((r,i)=>`<span class="nr">${i+1}.</span><span>${r.l}${same?'':` <span class="note">(${r.opts.join(' / ')})</span>`}</span>`).join('')}</div><p class="note">Schreib zu jeder Nummer die passende Antwort auf.</p>`;}
  if(t.typ==='zahl')h+=`<div class="zr">${t.rows.map((r,i)=>`<span class="nr">${i+1}.</span><span>${r.l} <span class="leer"></span> ${r.u}</span>`).join('')}</div>`;
  if(t.typ==='offen')h+=`<div class="heft">✎ Schreib deine Antwort in ganzen Sätzen ins Heft.</div>`;}
 h+=`<div class="tipps"></div><div class="actions"><button class="btn tippbtn" data-a="tipp">Tipp ▶</button><button class="btn ${t.typ==='rechnen'?'ghost':''}" data-a="ideal">${t.typ==='rechnen'?'Ich komme nicht weiter – Ideallösung zeigen':'Ideallösung anzeigen'}</button></div><div class="ideal hide">${idealHTML(t)}</div>
  <div class="rate hide"><span>Wie lief's?</span><button data-r="ok">✓ richtig</button><button data-r="teil">◐ teilweise</button><button data-r="nein">✗ noch nicht</button></div></div>`;
 return h;}
function idealHTML(t){
 if(t.typ==='rechnen'){let h=`<h4>Ideallösung im Fünf-Schritt</h4><div class="is"><span class="k">① gegeben:</span><span>${t.geg.join('<br>')}</span><span class="k">② gesucht:</span><span>${t.ges}</span>`;
  const multi=t.schritte.length>1;
  t.schritte.forEach(s=>{if(multi)h+=`<span class="zw">${s.t}</span>`;h+=`<span class="k">③ Formel:</span><span>${s.formel}</span><span class="k">④ Rechnung:</span><span>${s.rechnung.join('<br>')}</span>`;});
  h+=`<span class="k">⑤ Antwort:</span><span>${t.antwort}</span></div>`;if(t.hin)h+=`<p class="hin">Tipp: ${t.hin}</p>`;return h;}
 if(t.typ==='mc'){const r=[].concat(t.richtig);return `<h4>Ideallösung</h4>${t.diag?`<p>Richtig ist <b>${r.map(i=>LET[i]).join(', ')}</b>.</p>`:`<ul>${r.map(i=>`<li><b>${LET[i]}) ${t.opts[i]}</b></li>`).join('')}</ul>`}${t.erkl?`<p>${t.erkl}</p>`:''}`;}
 if(t.typ==='select')return `<h4>Ideallösung</h4><table class="t">${t.rows.map((r,i)=>`<tr><td><b>${i+1}.</b> ${r.l}</td><td><b>${r.r}</b></td></tr>`).join('')}</table>${t.erkl?`<p>${t.erkl}</p>`:''}`;
 if(t.typ==='zahl')return `<h4>Ideallösung</h4>${t.rows.map((r,i)=>`<p><b>${i+1}.</b> ${r.l} <b>${f(r.w)} ${r.u}</b></p>`).join('')}${t.erkl?`<p>${t.erkl}</p>`:''}`;
 if(t.typ==='offen')return `<h4>Ideallösung</h4><p>${t.ideal}</p>${t.krit?`<p><b>Daran erkennst du eine gute Antwort:</b></p><ul>${t.krit.map(k=>`<li>${k}</li>`).join('')}</ul>`:''}`;}
function bindSub(el,key,t){
 const rate=el.querySelector('.rate'),ideal=el.querySelector('.ideal'),btn=el.querySelector('[data-a="ideal"]');
 const setR=r=>{S.res[key]=r;rate.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));progress();};
 rate.querySelectorAll('button').forEach(b=>b.onclick=()=>setR(b.dataset.r));
 btn.onclick=()=>{ideal.classList.toggle('hide');rate.classList.remove('hide');btn.textContent=ideal.classList.contains('hide')?'Ideallösung anzeigen':'Ideallösung ausblenden';};
 const tb=el.querySelector('[data-a="tipp"]'),tbox=el.querySelector('.tipps'),TL=tipps(t);let tn=0;
 const zeig=n=>{tbox.innerHTML=TL.slice(0,n).map((x,i)=>`<div class="tipp"><b>Tipp${TL.length>1?' '+(i+1):''}:</b> ${x}</div>`).join('');tb.textContent=n<TL.length?(n?'Noch ein Tipp ▶':'Tipp ▶'):'Keine weiteren Tipps';tb.disabled=n>=TL.length;};
 tb.onclick=()=>{tn++;S.tip[key]=tn;zeig(tn);};if(S.tip[key]){tn=S.tip[key];zeig(tn);}else zeig(0);
 const chk=el.querySelector('[data-a="check"]');
 if(chk){const inp=el.querySelector('.erg input'),box=el.querySelector('.erg'),fbx=el.querySelector('.fbx');
  const run=()=>{const v=parseDE(inp.value);if(!isFinite(v)){fbx.innerHTML='<div class="fb bad">Gib zuerst dein Endergebnis als Zahl ein.</div>';return;}
   const d=diagnose(t,v);box.classList.remove('right','wrong');box.classList.add(d.ok?'right':'wrong');
   fbx.innerHTML=d.ok?`<div class="fb ok"><b>✓ Dein Ergebnis stimmt!</b><br>Hast du auch den Fünf-Schritt eingehalten – mit Formelzeichen und Einheiten in jeder Zeile und einem Antwortsatz? Vergleiche mit der Ideallösung unten.</div>`
    :`<div class="fb bad"><b>✗ Das stimmt noch nicht.</b><br><b>Möglicher Fehler:</b> ${d.m}<br>Hast du den Fünf-Schritt eingehalten und überall Formelzeichen und Einheiten hingeschrieben? Unten siehst du die Aufgabe im perfekten Fünf-Schritt.</div>`;
   ideal.classList.remove('hide');rate.classList.remove('hide');btn.textContent='Ideallösung ausblenden';if(!S.res[key])setR(d.ok?'ok':'nein');S.inp[key]=inp.value;};
  chk.onclick=run;inp.onkeydown=e=>{if(e.key==='Enter')run();};if(S.inp[key])inp.value=S.inp[key];}
 if(S.res[key]){setR(S.res[key]);rate.classList.remove('hide');}}
const subs=t=>t.typ==='einheit'?t.teile:[t];
function taskView(){const t=S.list[S.i],b=BER[t.bereich];
 let h=`<div id="prog"></div><div class="card"><div class="kopf"><span>Aufgabe ${S.i+1} von ${S.list.length} · ${b.name}</span><span class="stars">${NIV[S.niv][0]}</span></div><h2>${t.typ==='einheit'?'Aufgabe mit Material: ':''}${t.titel}</h2>`;
 if(t.typ==='einheit')h+=`<div class="material">${t.material}</div>`+t.teile.map((x,j)=>subHTML(x,S.i+'_'+j,'abcdef'[j]+')')).join('');
 else h+=subHTML(t,S.i+'_0');
 h+=`<div class="nav"><button class="btn ghost" id="prev" ${S.i?'':'disabled'}>← zurück</button><button class="btn" id="next">${S.i<S.list.length-1?'weiter →':'zur Auswertung'}</button></div></div>`;
 VW.innerHTML=h.replace(/(\d) (J|kJ|W|kW|kg|g|m|cm|s|min|t|h|%)(?![\wäöüß])/g,'$1&nbsp;$2');subs(t).forEach((x,j)=>bindSub(document.getElementById('s'+S.i+'_'+j),S.i+'_'+j,x));
 document.getElementById('prev').onclick=()=>{S.i--;taskView();};document.getElementById('next').onclick=()=>{if(S.i<S.list.length-1){S.i++;taskView();}else sumView();};
 progress();scrollTo(0,0);}
const pkt=x=>x.punkte||(x.typ==='select'||x.typ==='zahl'?Math.max(1,x.rows.length*.5):x.typ==='offen'?2:x.typ==='rechnen'?3:1);
function stat(i){const ss=subs(S.list[i]);let p=0,max=0,done=0;
 ss.forEach((x,j)=>{const pk=pkt(x);max+=pk;const r=S.res[i+'_'+j];if(r)done++;p+=r==='ok'?pk:r==='teil'?pk/2:0;});return {p,max,done,all:ss.length};}
function progress(){const el=document.getElementById('prog');if(!el)return;let tp=0,tm=0;
 el.innerHTML=S.list.map((t,i)=>{const s=stat(i);tp+=s.p;tm+=s.max;const c=s.done<s.all?'':s.p>=s.max?'ok':s.p>0?'teil':'nein';return `<button class="${i===S.i?'cur ':''}${c}" data-i="${i}" aria-label="Aufgabe ${i+1}">${i+1}</button>`;}).join('')+(S.mode==='ka'?`<span class="info">${f(tp,1)} / ${f(tm,1)} P.</span>`:'');
 el.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.i=+b.dataset.i;taskView();});}
function sumView(){let tp=0,tm=0;const per={};
 S.list.forEach((t,i)=>{const s=stat(i);tp+=s.p;tm+=s.max;const k=t.bereich;per[k]=per[k]||{p:0,max:0,done:0,all:0};per[k].p+=s.p;per[k].max+=s.max;per[k].done+=s.done;per[k].all+=s.all;});
 const pc=tm?tp/tm*100:0;
 VW.innerHTML=`<div class="card"><h2>Auswertung: ${S.mode==='ka'?'Klassenarbeit':BER[S.ber].name} <span class="stars">${NIV[S.niv][0]}</span></h2>
 <p><b>${f(tp,1)} von ${f(tm,1)} Punkten</b> (${f(pc,0)} %) – nach deiner eigenen Einschätzung.</p><div class="bar"><i style="width:${pc}%"></i></div>
 ${Object.keys(per).sort((a,b)=>a-b).map(k=>{const q=per[k],r=q.max?q.p/q.max:0,cls=q.done<q.all?'o':r>=.8?'g':r>=.5?'y':'r',txt=q.done<q.all?'nicht bewertet':r>=.8?'sicher':r>=.5?'fast':'noch üben';
  return `<div class="sumrow"><span><b>${BER[k].name}</b>${cls==='r'||cls==='y'?`<br><span class="note">Schlag im OneNote-Heft die Seite „${BER[k].name}“ auf${k==0?' (Merkkästen zum Fünf-Schritt und zu den Einheiten)':''}.</span>`:''}</span><span class="ampel ${cls}">${txt}</span></div>`;}).join('')}
 <p class="note">Übertrage dein Ergebnis in dein Kompetenzraster: sicher · fast · noch üben.</p>
 <div class="actions"><button class="btn" id="again">Nochmal mit neuen Aufgaben</button><button class="btn ghost" id="other">Anderes Niveau</button><button class="btn ghost" id="home">Zum Start</button></div></div>`;
 document.getElementById('again').onclick=go;document.getElementById('other').onclick=nivView;document.getElementById('home').onclick=startView;scrollTo(0,0);}
startView();
</script>
</body>
</html>
